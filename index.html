<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iSpyWithMyLittleEye - Clone</title>
<style>
*{margin:0;padding:0}
body{background:#000;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
c.width=1200;c.height=600;

// Игровые переменные
let section=0; // 0=паркур, 1=глаз
let sectionProgress=0;
let player={x:150,y:400,w:40,h:40,vy:0,onGround:false,rotation:0};
let eye={x:850,y:250,radius:90,state:'normal',timer:0,attackTimer:0,pulse:0,veins:[]};
let platforms=[],obstacles=[],particles=[],eyeAttacks=[];
let frame=0,gameOver=false,victory=false,started=false;
let keys={};

// Создаём вены для глаза
for(let i=0;i<20;i++){
  eye.veins.push({
    angle:Math.random()*Math.PI*2,
    length:Math.random()*60+40,
    width:Math.random()*3+1
  });
}

// Создаём паркур-секцию
function createParkour(){
  platforms=[];
  obstacles=[];
  // Платформы
  for(let i=0;i<12;i++){
    platforms.push({
      x:500+i*150,
      y:450-Math.random()*200,
      w:100,
      h:25
    });
  }
  // Шипы на полу
  for(let i=0;i<6;i++){
    obstacles.push({
      type:'spike',
      x:700+i*200,
      y:505,
      w:35,
      h:35
    });
  }
}

document.onkeydown=e=>{
  keys[e.code]=true;
  if(e.code=='Space')e.preventDefault();
  if(e.code=='Space'&&!started&&!gameOver&&!victory){
    started=true;
  }
  if(e.code=='KeyR'&&(gameOver||victory)){
    resetGame();
  }
};
document.onkeyup=e=>keys[e.code]=false;
c.onclick=()=>{
  if(!started&&!gameOver&&!victory)started=true;
  if(gameOver||victory)resetGame();
};

function resetGame(){
  section=0;
  sectionProgress=0;
  player={x:150,y:400,w:40,h:40,vy:0,onGround:false,rotation:0};
  eye={x:850,y:250,radius:90,state:'normal',timer:0,attackTimer:0,pulse:0,veins:eye.veins};
  platforms=[];obstacles=[];particles=[];eyeAttacks=[];
  frame=0;gameOver=false;victory=false;
  createParkour();
}

function update(){
  if(!started||gameOver||victory)return;
  frame++;
  
  // Физика игрока
  player.vy+=0.75;
  player.y+=player.vy;
  
  // Проверка столкновений с платформами
  player.onGround=false;
  platforms.forEach(p=>{
    if(player.x<p.x+p.w&&player.x+player.w>p.x&&
       player.y+player.h>p.y&&player.y+player.h<p.y+p.h+15&&
       player.vy>0){
      player.y=p.y-player.h;
      player.vy=0;
      player.onGround=true;
    }
  });
  
  // Пол
  if(player.y>505){
    player.y=505;
    player.vy=0;
    player.onGround=true;
  }
  
  // Вращение
  if(!player.onGround)player.rotation+=5;
  else player.rotation=0;
  
  // Прыжок
  if(keys['Space']&&player.onGround){
    player.vy=-14;
    player.onGround=false;
    // Частицы прыжка
    for(let i=0;i<8;i++){
      particles.push({
        x:player.x+player.w/2,
        y:player.y+player.h,
        vx:(Math.random()-0.5)*3,
        vy:Math.random()*2,
        life:25,
        color:'#0ff'
      });
    }
  }
  
  // Логика секций
  if(section===0){
    updateParkour();
  }else if(section===1){
    updateBoss();
  }
  
  // Обновление препятствий
  for(let i=obstacles.length-1;i>=0;i--){
    let o=obstacles[i];
    if(o.type==='moving'){
      o.x+=o.vx;
    }
    
    // Столкновение
    if(player.x<o.x+o.w&&player.x+player.w>o.x&&
       player.y<o.y+o.h&&player.y+player.h>o.y){
      gameOver=true;
      createExplosion();
    }
    
    if(o.x<-100)obstacles.splice(i,1);
  }
  
  // Обновление атак глаза
  for(let i=eyeAttacks.length-1;i>=0;i--){
    let a=eyeAttacks[i];
    if(a.type==='laser'){
      a.life--;
      if(a.life<=0)eyeAttacks.splice(i,1);
    }else if(a.type==='spike'){
      a.x+=a.vx;
      if(a.x<-100)eyeAttacks.splice(i,1);
    }else if(a.type==='charge'){
      a.x+=a.vx;
      a.y+=a.vy;
      if(a.x<-150)eyeAttacks.splice(i,1);
    }
    
    // Столкновение с атаками
    if(player.x<a.x+a.w&&player.x+player.w>a.x&&
       player.y<a.y+a.h&&player.y+player.h>a.y){
      gameOver=true;
      createExplosion();
    }
  }
  
  // Частицы
  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
}

function updateParkour(){
  sectionProgress+=0.2;
  
  // Двигаем всё влево
  platforms.forEach(p=>p.x-=2.5);
  obstacles.forEach(o=>{
    if(o.type==='moving')o.x+=o.vx;
    else o.x-=2.5;
  });
  
  // Переход к боссу
  if(sectionProgress>100){
    section=1;
    platforms=[];
    obstacles=[];
  }
}

function updateBoss(){
  eye.timer++;
  eye.pulse=Math.sin(frame*0.08)*8;
  
  // Логика глаза
  if(eye.state==='normal'&&eye.timer>150){
    eye.state='warning';
    eye.timer=0;
  }else if(eye.state==='warning'&&eye.timer>40){
    eye.state='attack';
    eye.timer=0;
    // Выбираем атаку
    let roll=Math.random();
    if(roll<0.35){
      // Лазер
      eyeAttacks.push({
        type:'laser',
        x:eye.x,
        y:eye.y,
        w:c.width,
        h:35,
        life:50
      });
    }else if(roll<0.7){
      // Шипы
      for(let i=0;i<4;i++){
        eyeAttacks.push({
          type:'spike',
          x:c.width+i*120,
          y:505,
          w:40,
          h:40,
          vx:-9
        });
      }
    }else{
      // Таран
      eyeAttacks.push({
        type:'charge',
        x:eye.x,
        y:eye.y,
        w:100,
        h:100,
        vx:-18,
        vy:0
      });
    }
  }else if(eye.state==='attack'&&eye.timer>70){
    eye.state='normal';
    eye.timer=0;
  }
  
  // Двигаем платформы для босс-файта
  platforms.forEach(p=>{
    p.x-=1.5;
    if(p.x<-150){
      p.x=c.width+Math.random()*100;
      p.y=450-Math.random()*150;
    }
  });
}

function createExplosion(){
  for(let i=0;i<40;i++){
    particles.push({
      x:player.x+player.w/2,
      y:player.y+player.h/2,
      vx:(Math.random()-0.5)*12,
      vy:(Math.random()-0.5)*12,
      life:50,
      color:'#f04'
    });
  }
}

function draw(){
  // Фон с градиентом
  let bgGrad=ctx.createLinearGradient(0,0,0,c.height);
  bgGrad.addColorStop(0,'#0a0a1a');
  bgGrad.addColorStop(1,'#1a0a2e');
  ctx.fillStyle=bgGrad;
  ctx.fillRect(0,0,c.width,c.height);
  
  // Сетка на фоне
  ctx.strokeStyle='rgba(0,255,255,0.06)';
  ctx.lineWidth=1;
  for(let i=0;i<c.width;i+=60){
    ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,c.height);ctx.stroke();
  }
  for(let i=0;i<c.height;i+=60){
    ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(c.width,i);ctx.stroke();
  }
  
  // Пол
  ctx.fillStyle='#111122';
  ctx.fillRect(0,540,c.width,60);
  ctx.strokeStyle='#0ff';
  ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,540);ctx.lineTo(c.width,540);ctx.stroke();
  
  // Платформы
  platforms.forEach(p=>{
    let grad=ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
    grad.addColorStop(0,'#333');
    grad.addColorStop(1,'#222');
    ctx.fillStyle=grad;
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.strokeStyle='#0ff';
    ctx.lineWidth=2;
    ctx.strokeRect(p.x,p.y,p.w,p.h);
  });
  
  // Препятствия (шипы)
  obstacles.forEach(o=>{
    if(o.type==='spike'||o.type==='moving'){
      ctx.fillStyle='#f04';
      ctx.beginPath();
      ctx.moveTo(o.x,o.y+o.h);
      ctx.lineTo(o.x+o.w/2,o.y);
      ctx.lineTo(o.x+o.w,o.y+o.h);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle='#fff';
      ctx.lineWidth=2;
      ctx.stroke();
    }
  });
  
  // Атаки глаза
  eyeAttacks.forEach(a=>{
    if(a.type==='laser'){
      let alpha=a.life/50;
      ctx.fillStyle=`rgba(255,0,0,${alpha})`;
      ctx.fillRect(0,a.y-17,c.width,a.h+34);
      ctx.strokeStyle=`rgba(255,255,255,${alpha})`;
      ctx.lineWidth=3;
      ctx.strokeRect(0,a.y-17,c.width,a.h+34);
    }else if(a.type==='spike'){
      ctx.fillStyle='#f04';
      ctx.beginPath();
      ctx.moveTo(a.x,a.y+a.h);
      ctx.lineTo(a.x+a.w/2,a.y);
      ctx.lineTo(a.x+a.w,a.y+a.h);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle='#fff';
      ctx.lineWidth=2;
      ctx.stroke();
    }else if(a.type==='charge'){
      ctx.fillStyle='#f0f';
      ctx.fillRect(a.x,a.y,a.w,a.h);
      ctx.strokeStyle='#fff';
      ctx.lineWidth=4;
      ctx.strokeRect(a.x,a.y,a.w,a.h);
    }
  });
  
  // Глаз (БОСС)
  if(section===1){
    drawEye();
  }
  
  // Игрок (куб)
  ctx.save();
  ctx.translate(player.x+player.w/2,player.y+player.h/2);
  ctx.rotate(player.rotation*Math.PI/180);
  
  // Тень
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.fillRect(-player.w/2+4,-player.h/2+4,player.w,player.h);
  
  // Тело с градиентом
  let pGrad=ctx.createLinearGradient(-player.w/2,-player.h/2,player.w/2,player.h/2);
  pGrad.addColorStop(0,'#0ff');
  pGrad.addColorStop(1,'#088');
  ctx.fillStyle=pGrad;
  ctx.fillRect(-player.w/2,-player.h/2,player.w,player.h);
  
  // Обводка
  ctx.strokeStyle='#fff';
  ctx.lineWidth=3;
  ctx.strokeRect(-player.w/2,-player.h/2,player.w,player.h);
  
  // Глаз куба
  ctx.fillStyle='#000';
  ctx.fillRect(6,-10,12,12);
  ctx.fillStyle='#fff';
  ctx.fillRect(9,-8,5,5);
  
  ctx.restore();
  
  // Частицы
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/50;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,5,5);
  });
  ctx.globalAlpha=1;
  
  // UI
  ctx.textAlign='left';
  if(section===0){
    ctx.fillStyle='#0ff';
    ctx.font='bold 28px Arial';
    ctx.fillText('ПАРКУР: '+Math.floor(sectionProgress)+'%',30,40);
  }else if(section===1){
    ctx.fillStyle='#f00';
    ctx.font='bold 28px Arial';
    ctx.fillText('БОСС-ФАЙТ',30,40);
  }
  
  // Стартовый экран
  if(!started){
    ctx.fillStyle='rgba(0,0,0,0.9)';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle='#0ff';
    ctx.font='bold 72px Arial';
    ctx.textAlign='center';
    ctx.fillText('iSpy CLONE',c.width/2,c.height/2-40);
    ctx.font='bold 32px Arial';
    ctx.fillStyle='#fff';
    ctx.fillText('iSpyWithMyLittleEye',c.width/2,c.height/2+20);
    ctx.font='24px Arial';
    ctx.fillStyle='#aaa';
    ctx.fillText('Нажми ПРОБЕЛ или КЛИКНИ',c.width/2,c.height/2+70);
  }
  
  // Game Over
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.9)';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle='#f00';
    ctx.font='bold 80px Arial';
    ctx.textAlign='center';
    ctx.fillText('ГЛАЗ ТЕБЯ ПОЙМАЛ!',c.width/2,c.height/2-30);
    ctx.fillStyle='#fff';
    ctx.font='28px Arial';
    ctx.fillText('Нажми R или КЛИКНИ для рестарта',c.width/2,c.height/2+40);
  }
  
  // Victory
  if(victory){
    ctx.fillStyle='rgba(0,0,0,0.9)';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle='#0f0';
    ctx.font='bold 80px Arial';
    ctx.textAlign='center';
    ctx.fillText('ПОБЕДА!',c.width/2,c.height/2-30);
    ctx.fillStyle='#fff';
    ctx.font='28px Arial';
    ctx.fillText('Ты прошёл уровень!',c.width/2,c.height/2+40);
  }
}

function drawEye(){
  // Определяем цвет
  let eyeColor;
  if(eye.state==='normal')eyeColor='#ffffff';
  else if(eye.state==='warning')eyeColor='#ffaa00';
  else if(eye.state==='attack')eyeColor='#ff0000';
  else eyeColor='#ffffff';
  
  // Свечение вокруг глаза
  let glow=ctx.createRadialGradient(eye.x,eye.y,0,eye.x,eye.y,eye.radius*2.2);
  glow.addColorStop(0,eyeColor+'60');
  glow.addColorStop(0.5,eyeColor+'20');
  glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;
  ctx.fillRect(eye.x-eye.radius*2.2,eye.y-eye.radius*2.2,eye.radius*4.4,eye.radius*4.4);
  
  // Вены (сосуды)
  ctx.strokeStyle=eyeColor;
  eye.veins.forEach(v=>{
    ctx.lineWidth=v.width;
    ctx.globalAlpha=0.6;
    ctx.beginPath();
    ctx.moveTo(eye.x,eye.y);
    let endX=eye.x+Math.cos(v.angle)*(eye.radius+v.length+eye.pulse);
    let endY=eye.y+Math.sin(v.angle)*(eye.radius+v.length+eye.pulse);
    ctx.lineTo(endX,endY);
    ctx.stroke();
  });
  ctx.globalAlpha=1;
  
  // Основной круг глаза
  ctx.beginPath();
  ctx.arc(eye.x,eye.y,eye.radius+eye.pulse,0,Math.PI*2);
  ctx.fillStyle=eyeColor;
  ctx.fill();
  
  // Обводка
  ctx.strokeStyle='#000';
  ctx.lineWidth=6;
  ctx.stroke();
  
  // Внутренний круг
  ctx.beginPath();
  ctx.arc(eye.x,eye.y,eye.radius*0.85,0,Math.PI*2);
  ctx.strokeStyle='rgba(0,0,0,0.3)';
  ctx.lineWidth=3;
  ctx.stroke();
  
  // Зрачок (следит за игроком)
  let dx=player.x-eye.x;
  let dy=player.y-eye.y;
  let dist=Math.sqrt(dx*dx+dy*dy);
  let pupilX=eye.x+(dx/dist)*25;
  let pupilY=eye.y+(dy/dist)*25;
  
  ctx.beginPath();
  ctx.arc(pupilX,pupilY,32,0,Math.PI*2);
  ctx.fillStyle='#000';
  ctx.fill();
  
  // Блик в зрачке
  ctx.beginPath();
  ctx.arc(pupilX-12,pupilY-12,11,0,Math.PI*2);
  ctx.fillStyle='#fff';
  ctx.fill();
  
  // Дополнительный блик
  ctx.beginPath();
  ctx.arc(pupilX+8,pupilY+8,5,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fill();
  
  // Индикатор атаки (кольцо вокруг глаза)
  if(eye.state==='warning'||eye.state==='attack'){
    ctx.beginPath();
    ctx.arc(eye.x,eye.y,eye.radius+15+eye.pulse,0,Math.PI*2);
    ctx.strokeStyle=eye.state==='warning'?'#ffaa00':'#ff0000';
    ctx.lineWidth=5;
    ctx.stroke();
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

createParkour();
loop();
</script>
</body>
</html>
